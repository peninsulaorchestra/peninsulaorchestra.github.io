# Announcements shown on the Events page, newest first.

- title: Rehearsals resume in September
  body: >-
    The orchestra rehearses every Monday evening, 7:30–9:30 pm, at Trillium
    United Church, 415 Linwell Rd., St. Catharines, ON L2M 2P3. New members
    are welcome — come and play with us.

- title: Out of the Cold concert update — $1,495.20 raised
  body: >-
    George, Gus and Myra met with Karrie Porter, City Councillor for
    St. Catharines and an employment staff member at Start Me Up Niagara. Karrie
    explained the programs Start Me Up Niagara provides to the city's most
    vulnerable citizens. Their drop-in centre — coffee and snacks available all
    day, alongside a nursing office, overnight beds and a wide range of support
    services — now sees over 51,000 visits a year, a vast increase on the 7,000
    it started with a few years ago. They also run a separate employment
    advisory office helping people on the Ontario Disability Support Program
    become employable and start their own small businesses.


    The funds we helped raise go to the Out of the Cold program, which operates
    from several churches and from Start Me Up Niagara's headquarters. Karrie
    thanked the orchestra many times, commented on what an excellent concert we
    presented, and asked whether we would do another fundraising concert next
    year.
