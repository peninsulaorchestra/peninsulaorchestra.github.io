# ─────────────────────────────────────────────────────────────
# Site-wide settings. Change something here and it updates
# everywhere on the site at once.
# ─────────────────────────────────────────────────────────────

title: Peninsula Orchestra
tagline: We are a group of serious amateur musicians in Niagara enjoying a variety of music and sharing it with community concerts!
description: >-
  The Peninsula Orchestra is a group of serious amateur musicians in Ontario's
  Niagara region, enjoying a variety of music and sharing it through community concerts.
url: https://peninsulaorchestra.ca

# Used on the contact page, the events page, and by the contact form. Forwarded
# by Porkbun to the committee's own inboxes — change the recipients there, not
# here.
contact_email: info@peninsulaorchestra.ca

# Contact form (Web3Forms). The form on the Contact page posts to Web3Forms,
# which emails each submission to the address the key was created with. To send
# them somewhere else, create a new key at web3forms.com and paste it in here.
#
# This is a public identifier, not a secret — it is visible in the page source
# of any site using Web3Forms, so it is fine for it to live here.
web3forms_key: "b5798ef0-573e-4b11-b6ff-4441616637a2"

# Where else the orchestra exists online. Used for the Facebook link on the
# Events page, and to tell search engines that this site and that page are the
# same organisation.
facebook: https://www.facebook.com/p/Peninsula-Orchestra-100064857121631/

# The "message us" button in the corner of every page. It opens a Messenger
# conversation with the Facebook page above, so replies arrive in the page inbox
# on your phone. Blank this line and the button disappears.
messenger: https://m.me/100064857121631

# Used in the structured data that search engines and AI assistants read.
founded: "1978"
logo: /images/logo.png
share_image: /images/hero.jpg

# The footer year comes from the build date, so it can never go stale.

# Rehearsal venue and terms. Defined once here and rendered on the About and
# Contact pages, so there is a single place to change it.
rehearsal:
  venue: Trillium United Church
  street: 415 Linwell Rd.
  city: St. Catharines, ON
  postal: L2M 2P3
  when: Mondays, 7:30–9:30 pm
  season: Mid-September through June
  membership: $90 per year for adults. Student, family and financial-needs discounts may apply.

# The menu across the top of every page. Reorder or rename here.
nav:
  - title: Home
    url: /
  - title: About Us
    url: /about/
  - title: Photo Gallery
    url: /gallery/
  - title: Events, News and Links
    url: /events/
  - title: Contact Us
    url: /contact/

plugins:
  - jekyll-sitemap

# Files kept out of the built site. Note this REPLACES Jekyll's default
# exclude list, so the build tooling has to be listed explicitly.
exclude:
  - README.md
  - images/README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
