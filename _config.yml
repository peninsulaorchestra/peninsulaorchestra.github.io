title: Peninsula Orchestra
tagline: We are a group of serious amateur musicians in Niagara enjoying a variety of music and sharing it with community concerts!
description: >-
  The Peninsula Orchestra is a group of serious amateur musicians in Ontario's
  Niagara region, enjoying a variety of music and sharing it through community concerts.
url: https://peninsulaorchestra.ca

# Used on the contact page, the events page, and by the contact form.
