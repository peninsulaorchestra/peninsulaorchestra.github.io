- title: Holiday Concert
  date: 2025-12-15
  description: >-
    A celebration of the holiday season, and our best-attended concert yet with
    145 guests. Two barrels of non-perishable food were collected in support of
    Community Care of St Catharines.
  programme:
    - Beethoven — Die Weihe des Hauses, Op. 124
    - Mendelssohn — Piano Concerto No. 1 in G minor, Op. 25
    - Tchaikovsky — Suite No. 4, Op. 61 "Mozartiana"

- title: 2025 Chamber Fest
  date: 2025-08-18
  date_end: 2025-08-22
  time: Evening rehearsals, 6:30–9:30 pm
  venue: Wesley United Church
  address: 244 First Ave N, Welland, ON L3C 1Y8
  description: >-
    Sixteen players, two of them from outside the orchestra, worked in four
    coached ensembles across the week. Coaching was led by George Cleland,
    Gordon Cleland, Daniela Cruz and Michael Rosenberger.

- title: Spring Concert
  date_text: Spring 2025
  venue: Congregation B'Nai Israel
  soloist: Michael Rosenberger, French horn
  description: >-
    Our relationship with the Congregation B'Nai Israel has, over the years,
    helped us elevate our artistic platform within the Niagara Region. A
    reception with orchestra members followed the concert.
  programme:
    - Leroy Anderson — Serenata
    - Beethoven — Ouvertüre zu Collins Trauerspiel "Coriolan", Op. 62
    - C. M. von Weber — Concertino in E minor, Op. 45
    - "arr. Calvin Custer — Star Trek Through the Years"
    - Schubert — Symphony No. 8 in B minor, "Unfinished"

- title: Spring Concert — in memory of Ivan Samson
  date: 2024-05-28
  time: 4:00 pm
  venue: Congregation B'nai Israel
  address: 190 Church St, St Catharines
  soloist: Grace Snippe, cello
  tickets: $10.00 each, available at the door
  description: Performing Miranda, Rossini, Bruch and Schubert.
  poster: ivan-samson.jpg
