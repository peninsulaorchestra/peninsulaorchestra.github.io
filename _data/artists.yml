# Guest artists who have appeared with the orchestra.

- name: Lisa Donati
  role: Guest conductor
  bio: >-
    Lisa Donati completed her Bachelor of Music Performance in French Horn at
    Wilfrid Laurier University, and her Masters of Music Performance at the
    Royal Academy of Music in London, England. She studied with international
    soloists Michael Thompson and Richard Watkins, and the natural and baroque
    horns with Andrew Clark, then continued at the Glenn Gould School of the
    Royal Conservatory of Music's Artist Diploma Program with Christopher
    Gongos. Lisa has played with the National Youth Orchestra of Canada, the
    National Academy Orchestra of Canada, the London International Orchestra of
    Academia, and the Britten-Pears Orchestra in England.


    During her time in London she performed with the London Sinfonietta at
    engagements including the BBC Proms in the Royal Albert Hall and the
    re-opening of the Royal Festival Hall broadcast live on BBC Radio, and
    recorded with them for EMI Records at Abbey Road Studios with Icelandic band
    Sigur Rós. She performed live on BBC Radio alongside Michael Thompson, and
    in 2008 was featured on CBC Radio in Canada and performed in the Opera
    Ischia Orchestra in Italy. Lisa has also performed with the Toronto
    Philharmonia, the Niagara Symphony Orchestra, the Windsor Symphony
    Orchestra, Orchestra London, and Toronto's Trillium Brass Quintet.


    Lisa is the Orchestra Conductor at the Niagara Symphony Orchestra's Summer
    Music Camp, where she also conducts the Concert Band and has been wind and
    brass faculty since 2011. She is Conductor of the Niagara Youth Concert
    Orchestra, and has been wind and brass coach of the NYO since 2011. She is a
    regular guest conductor and coach of the Peninsula Orchestra, and maintains
    a studio of brass students, many of whom have gone on to study music at
    McGill, Toronto, Laurier and Brock.

- name: Luis Gerardo Molina Gonzalez
  role: Pianist
  bio: >-
    Luis Gerardo Molina Gonzalez is a Mexican pianist and computer scientist
    with a degree in Computer Systems Engineering from the University of the
    Americas Puebla, Mexico. He completed three years of music studies at the
    same college before coming in 2017 to Brock University in St Catharines,
    where he completed the Bachelor of Music in Piano Performance with Dr. Karin
    Di Bella. He is currently studying in the Master's programme in Music
    Literature and Performance at the University of Western Ontario in London
    with Dr. Leslie Kinton.


    Luis has studied piano with many prominent teachers for over twenty years.
    His performance career encompasses international competitions and
    performances in France, the U.S.A., Germany, Poland, Russia, Mexico and
    Canada, in venues including the Invalides Church and Radio France in Paris,
    the Music Instruments Museum in Berlin, the Regional Conservatory of Nice,
    Geistag in Munich, the Asian-Pacific International Arts Festival of
    Krasnoyarsk in Russia, and the Lublin Conservatory in Poland, as well as the
    television series Camerata 22 and the Cervantino International Festival in
    Mexico. He has also performed as an orchestral soloist in Mexico and France.
