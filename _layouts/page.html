---
layout: default
---
<section>
  <div class="container prose">
    {{ content }}
  </div>
</section>

{%- if page.cta %}
<section class="alt-bg">
  <div class="container text-center">
    <h2 class="section-title">{{ page.cta.title }}</h2>
    <hr class="divider" />
    <p class="section-intro">{{ page.cta.text }}</p>
    <a class="btn" href="{{ page.cta.url | relative_url }}">{{ page.cta.label }}</a>
  </div>
</section>
{%- endif %}
