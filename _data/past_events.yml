# PAST concerts, newest first.
#
# Migrated from peninsula-orchestra.com. The old site gave no years; these were
# derived from its running order, which was chronological, anchored on the
# December 2023 concert it described as "our first concert of the 2023-2024
# season" in the orchestra's new home.

- title: 2026 Chamber Fest
  date: 2026-08-17
  date_end: 2026-08-21
  time: Evening rehearsals, 6:30–9:30 pm
  venue: Wesley United Church
  address: 244 First Ave N, Welland, ON L3C 1Y8
  description: >-
    Musicians worked on pieces in smaller instrumental groups arranged by our
    Music Director to suit each group's skill level and mix of instruments —
    some as small as 2–4 players, others 4–6. Each group was assigned an
    instructor to help develop its sound and technique, with a larger ensemble
    formed to play a piece or two together. Players could also attend as a
    preformed group with their own music.
  link_url: https://docs.google.com/forms/d/e/1FAIpQLSezlUa6Uy7l1znT5D5pqAI9d1H1tP6NeU0nPtW7WZoqEuY-9w/viewform
  link_text: Chamber Fest signup form
  poster: chamberfest-2026.jpg
  poster_alt: >-
    Chamber Fest 2026 poster — August 17 to 21, 6:30 to 9:30, Wesley United
    Church, 244 First Ave, Welland, with a QR code linking to the registration
    form

- title: From Classical Forms to Romantic Expression
  date: 2026-05-30
  time: 4:00 p.m., doors at 3:30 pm
  venue: St Thomas Church
  address: 99 Ontario St, St Catharines
  soloist: Eduardo Farias, trumpet
  description: An afternoon of orchestral masterworks.
  programme:
    - Haydn — Trumpet Concerto in E-flat major
    - Beethoven — Symphony No. 2
    - Borodin — selections from the Polovtsian Dances
    - Bach — Sheep May Safely Graze

- title: Maritime Concert
  date: 2026-02-27
  venue: Jubilee Fellowship
  description: >-
    Proceeds from the concert were shared with the Out of the Cold foundation in
    St Catharines. Donations were up on previous years, letting the orchestra
    pass on $900.
  programme:
    - Frozen
    - What's Up at the Symphony
    - Molly on the Shore
    - The Sound of Music
    - Pink Panther
    - Ballet Parisian
    - Star Wars

- title: Captains and Chiefs
  date: 2026-02-25
  venue: Club Roma Pavilion
  address: St Catharines, ON
  description: >-
    A paid engagement for Algoma Central Corporation's annual Captains and Chiefs
    event, played by a ten-piece ensemble drawn from the orchestra.

