- title: Mid-Winter Concert
  date: 2024-02-10
  time: 7:30 pm
  venue: Covenant Christian Reformed Church
  address: 278 Parnell Rd, St Catharines
  description: >-
    Featuring Mendelssohn's Fingal's Cave. Donations were collected in support
    of Out of the Cold.

- title: Holiday Concert
  date: 2023-12-12
  time: 7:00 pm
  venue: Trillium United Church
  address: 415 Linwell Rd., St. Catharines
  description: >-
    Our first concert of the season — a varied selection from the classical
    repertoire, including traditional European carols, and our first concert in
    our new home. Free admission, with non-perishable food items collected for
    Community Care St Catharines.
  programme:
    - Martini/Blane arr. Whitney — Have Yourself a Merry Little Christmas
    - Washington/Harline arr. Isaac — When You Wish Upon a Star
    - Williams arr. Smith — Star Wars Theme
    - Kent — I'll Be Home For Christmas
    - Beethoven — Symphony No. 1 in C major, 2nd movement
    - arr. Surell — Christmas Carol Medley
    - Anderson — Sleigh Ride
