{%- if site.tawk.property_id != "" and site.tawk.widget_id != "" %}
<!-- Replaces tawk.to's own launcher, which is a green bubble that does not belong
     on a monochrome site. Stays hidden until the chat script has actually loaded,
     which only happens once someone accepts the cookie notice. -->
<button type="button" class="chat-launcher" id="chat-launcher" aria-label="Open chat" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <path d="M20.4 11.6a8 8 0 0 1-8.6 8 9 9 0 0 1-2.7-.4L4 21l1.5-4.4a7.8 7.8 0 0 1-1.9-5 8 8 0 0 1 8.6-8 8 8 0 0 1 8.2 8z" />
  </svg>
</button>
{%- endif %}
