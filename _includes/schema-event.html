{%- comment -%}
  One concert as a schema.org MusicEvent object, without the surrounding
  <script> tag. Used by the concert's own page and by the Events page list.
  Callers must only pass events with an exact date, i.e. no `year:` (TBA) and
  no `date_text:` (approximate).

  A start time is included when the `date:` has one (e.g. 2026-05-30 16:00).
  Soloists are read as "Name, instrument", and programme lines as
  "Composer — Work" ("A/B — Work" for two composers; "arr. X" is dropped,
  since an arranger isn't the composer).

  The venue's address comes from _data/venues.yml, split into parts, which is
  what Artsdata and Google need; a concert's own one-line `address:` is the
  fallback. `price:` (a number, 0 for free) and/or `tickets:` add an offer.
  `organizer:` / `organizer_url:` name a host other than the orchestra.
{%- endcomment -%}
{%- assign event = include.event -%}
{%- assign org = site.url | append: "/#organization" -%}
{%- capture org_ref -%}
{ "@type": "MusicGroup", "@id": {{ org | jsonify }}, "name": {{ site.title | jsonify }}, "url": {{ site.url | jsonify }} }
{%- endcapture -%}
{%- include find-venue.html name=event.venue -%}
{%- assign clock = event.date | date: "%H:%M" -%}
{%- if clock == "00:00" -%}
  {%- assign start = event.date | date: "%Y-%m-%d" -%}
{%- else -%}
  {%- assign start = event.date | date: "%Y-%m-%dT%H:%M:%S%:z" -%}
{%- endif -%}
    {
      "@type": "MusicEvent",
      "additionalType": "http://kg.artsdata.ca/resource/PerformingArtsEvent",
      "@id": {{ event.url | absolute_url | append: "#event" | jsonify }},
      "name": {{ event.title | jsonify }},
      "url": {{ event.url | absolute_url | jsonify }},
      "startDate": {{ start | jsonify }},
      {%- if event.date_end %}
      "endDate": {{ event.date_end | date: "%Y-%m-%d" | jsonify }},
      {%- endif %}
      "eventStatus": "https://schema.org/EventScheduled",
      "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
      {%- if event.description %}
      "description": {{ event.description | strip_newlines | jsonify }},
      {%- endif %}
      {%- if event.poster %}
      "image": {{ "/images/posters/" | append: event.poster | absolute_url | jsonify }},
      {%- endif %}
      {%- if event.venue %}
      "location": {
        "@type": "Place",
        "name": {{ event.venue | jsonify }}
        {%- if venue %},
        "address": {
          "@type": "PostalAddress",
          {%- if venue.street %}
          "streetAddress": {{ venue.street | jsonify }},
          {%- endif %}
          {%- if venue.city %}
          "addressLocality": {{ venue.city | jsonify }},
          {%- endif %}
          {%- if venue.province %}
          "addressRegion": {{ venue.province | jsonify }},
          {%- endif %}
          {%- if venue.postal %}
          "postalCode": {{ venue.postal | jsonify }},
          {%- endif %}
          "addressCountry": "CA"
        }
        {%- elsif event.address %},
        "address": {{ event.address | jsonify }}
        {%- endif %}
      },
      {%- endif %}
      {%- if event.programme %}
      {%- assign works = event.programme | where_exp: "w", "w != 'Intermission'" %}
      "workPerformed": [
        {%- for line in works %}
        {%- assign parts = line | split: " — " %}
        {%- if parts.size > 1 %}
          {%- assign composer = parts[0] | split: "arr. " | first | strip %}
          {%- assign piece = line | remove_first: parts[0] | remove_first: " — " %}
        {%- else %}
          {%- assign composer = "" %}
          {%- assign piece = line %}
        {%- endif %}
        {
          "@type": "MusicComposition",
          "name": {{ piece | jsonify }}
          {%- if composer != "" %}
          {%- assign composers = composer | split: "/" %},
          "composer": [
            {%- for name in composers %}
            { "@type": "Person", "name": {{ name | strip | jsonify }} }{% unless forloop.last %},{% endunless %}
            {%- endfor %}
          ]
          {%- endif %}
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ],
      {%- endif %}
      {%- if event.price != nil or event.tickets %}
      {%- if event.price == 0 %}
      "isAccessibleForFree": true,
      {%- endif %}
      "offers": {
        "@type": "Offer",
        "url": {{ event.link_url | default: event.url | absolute_url | jsonify }},
        {%- if event.price != nil %}
        "price": {{ event.price | jsonify }},
        {%- endif %}
        {%- if event.tickets %}
        "description": {{ event.tickets | jsonify }},
        {%- endif %}
        "priceCurrency": "CAD"
      },
      {%- endif %}
      "performer": [
        {{ org_ref }}
        {%- if event.soloist %}
        {%- assign soloist = event.soloist | split: ", " %},
        {
          "@type": "Person",
          "name": {{ soloist[0] | jsonify }}
          {%- if soloist.size > 1 %},
          "description": {{ event.soloist | remove_first: soloist[0] | remove_first: ", " | jsonify }}
          {%- endif %}
        }
        {%- endif %}
      ],
      {%- if event.organizer %}
      "organizer": {
        "@type": "Organization",
        "name": {{ event.organizer | jsonify }}
        {%- if event.organizer_url %},
        "url": {{ event.organizer_url | jsonify }}
        {%- endif %}
      }
      {%- else %}
      "organizer": {{ org_ref }}
      {%- endif %}
    }
