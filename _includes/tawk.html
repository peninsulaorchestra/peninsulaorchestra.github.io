{%- if site.tawk.property_id != "" and site.tawk.widget_id != "" %}
<!-- Cookie notice. The chat widget is only loaded once someone accepts, so
     declining means no third-party script and no cookies are set at all. -->
<div class="cookie-notice" id="cookie-notice" hidden
     data-tawk-src="https://embed.tawk.to/{{ site.tawk.property_id }}/{{ site.tawk.widget_id }}">
  <p>We use a live chat service so you can message us from the site. It sets
     cookies in your browser. Nothing loads unless you say yes.</p>
  <div class="cookie-notice-actions">
    <button type="button" class="btn" data-cookie-accept>Accept</button>
    <button type="button" class="btn ghost" data-cookie-decline>No thanks</button>
  </div>
</div>
{%- endif %}
