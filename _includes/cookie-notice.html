{%- if site.web3forms_key != "" %}
<!-- Cookie notice. The third-party script it covers — the contact form's spam
     check — is loaded only once someone accepts, so declining means no
     third-party script and no cookies are set at all. The wording is
     deliberately generic: it does not need editing when the list changes, and
     the notice hides itself when there is nothing to consent to. -->
<div class="cookie-notice" id="cookie-notice" hidden
     data-captcha-src="https://web3forms.com/client/script.js">
  <p>We use cookies for a few features on this site. Nothing loads unless you accept.</p>
  <div class="cookie-notice-actions">
    <button type="button" class="btn" data-cookie-accept>Accept</button>
    <button type="button" class="btn ghost" data-cookie-decline>No thanks</button>
  </div>
</div>
{%- endif %}
